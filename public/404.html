<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DishFromThis</title>
    <script>
      // SPA routing fallback for S3 static hosting.
      // Redirects all 404s back to index.html with the original path preserved.
      var path = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/' + '#' + path);
    </script>
  </head>
  <body></body>
</html>
